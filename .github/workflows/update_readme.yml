name: 🔄 Auto Update README

on:
  schedule:
    - cron: '0 */6 * * *'  # runs every 6 hours
  workflow_dispatch:       # allows manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Run dynamic content updater
      run: |
        echo "🧠 Updating README with fresh stats..."
        curl -o README.md https://raw.githubusercontent.com/utkarshverma439/utkarshverma439/main/README_template.md
        echo "✅ README updated!"

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "🔄 Auto-update README [skip ci]" || echo "No changes to commit"
        git push
