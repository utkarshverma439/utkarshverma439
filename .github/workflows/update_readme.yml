name: 🔄 Auto Update README

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update timestamp in README
        run: |
          echo "🧠 Updating README timestamp..."
          sed -i "s|<!--TIMESTAMP-->|$(date '+%Y-%m-%d %H:%M:%S') UTC|" README.md || echo "No timestamp placeholder found"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🔄 Auto-update README [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
